name: 'AI Graph Scanner'
description: 'Scans repositories for AI models, MCP servers/tools, and Agentic AI frameworks with policy enforcement'
author: 'AIGraph'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  spec-file:
    description: 'Path to the spec file defining allow/deny lists'
    required: false
    default: '.aigraph-spec.yml'
  scan-path:
    description: 'Path to scan (defaults to repository root)'
    required: false
    default: '.'
  fail-on-violation:
    description: 'Fail the action if policy violations are found'
    required: false
    default: 'true'
  output-format:
    description: 'Output format (json, markdown, or text)'
    required: false
    default: 'markdown'
  github-repo:
    description: 'Public GitHub repository to scan (e.g., owner/repo or owner/repo@branch). When provided, scan-path is ignored.'
    required: false
    default: ''

outputs:
  violations-found:
    description: 'Whether any policy violations were found'
  violations-count:
    description: 'Number of policy violations found'
  scan-results:
    description: 'Full scan results in JSON format'

runs:
  using: 'node20'
  main: 'dist/index.js'
